<div class="slide-header" data-animate="fade-up">
  <span class="slide-kicker">{{ slide.eyebrow | default('') }}</span>
  <h1 class="slide-title">{{ slide.title }}</h1>
</div>

<div class="flex gap-8" style="flex: 1;">
  <div class="content-panel flex-1" data-animate="fade-right">
    <h3 class="item-title" style="color: var(--accent-{{ slide.data.left.color | default('red') }});">{{ slide.data.left.title }}</h3>
    <div class="body-copy" style="white-space: pre-line;">{{ slide.data.left.content }}</div>
  </div>
  <div class="content-panel flex-1" data-animate="fade-left">
    <h3 class="item-title" style="color: var(--accent-{{ slide.data.right.color | default('green') }});">{{ slide.data.right.title }}</h3>
    <div class="body-copy" style="white-space: pre-line;">{{ slide.data.right.content }}</div>
  </div>
</div>
